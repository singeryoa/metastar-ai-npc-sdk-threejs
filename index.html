
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Metastar AI NPC SDK — three.js example</title>
  <style>html, body, canvas { margin: 0; width: 100%; height: 100%; display: block; }</style>
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
                 "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/" } }
  </script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
  import * as THREE from "three";
  import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
  import { MetastarNPC } from "https://metastar.world/static/sdk/v0/npc.three.js";

  const canvas = document.getElementById("c");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x9ebde0);
  const camera = new THREE.PerspectiveCamera(60, 1, 0.05, 200);
  camera.position.set(0, 1.6, -2);
  camera.lookAt(0, 1.4, 3);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x556655, 2.5));
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), new THREE.MeshStandardMaterial({ color: 0x73806f }));
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);
  function resize() {
    renderer.setSize(innerWidth, innerHeight, false);
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  }
  addEventListener("resize", resize); resize();
  renderer.setAnimationLoop(() => renderer.render(scene, camera));

  MetastarNPC.init({
    publicKey: "pk_live_xxxxxxxx",          // from the dashboard
    npcId: "npc_xxxxxxxx",                  // from the dashboard
    THREE, GLTFLoader, scene, camera, renderer,
    position: { x: 0, y: 0, z: 3 },
    rotationY: Math.PI,
    getPlayerPosition: () => camera.position,
    onError: (e) => console.error("NPC failed:", e.code, e.message)
  });
</script>
</body>
</html>
